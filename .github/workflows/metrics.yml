name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: amol3793
          # Improves accuracy of total commits / issues / PRs / repos-contributed-to
          base_indepth: yes
          # Replaces the broken top-langs card
          plugin_languages: yes
          # Replaces the broken trophies widget
          plugin_achievements: yes
