name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Personal stats (amol3793)
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: amol3793

          # Deliberately OFF. base_indepth walks the contributions collection
          # over the whole account lifetime instead of the last year, which is
          # what turned the commit count into an all-time figure. Leaving it off
          # keeps the GitHub default window: the last 12 months.
          base_indepth: no

          # Only these two sections are needed - header holds "Contributed to N
          # repositories", activity holds the commit count. extras_js below
          # strips everything else out of both.
          base: header, activity, metadata
          config_timezone: Asia/Kolkata

          # Replaces the broken top-langs card
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_threshold: 2%
          plugin_languages_other: yes

          # No contributions calendar. plugin_isocalendar can only plot days it
          # has dates for, and GitHub returns private contributions as a bare
          # restrictedContributionsCount with no dates. Of the commits counted
          # above, only about half are public (62 across 8 days in the last
          # year), so the calendar rendered ~172 of 180 days as empty and
          # visually contradicted the commit count sitting right above it.

          # Trophies replacement - disabled for now: upstream bug, the
          # achievements query still references the fully-removed GitHub
          # Projects (classic) API and errors out entirely.
          # https://github.com/lowlighter/metrics/issues/1706
          plugin_achievements: no

          # Strip every field except the commit count, repos contributed to and
          # languages, then label the commit count with the window it covers.
          #
          # This runs inside puppeteer before the SVG is measured and
          # serialized, so removed nodes are gone from the committed file AND
          # the card shrinks to fit. Note that h1/h2/h3 headings also carry the
          # .field class, so loops that must only touch value rows say div.field.
          extras_js: |
            const DROP = [
              /^Joined GitHub /,
              /^Followed by /,
              /^\d[\d,]* Pull requests? reviewed$/,
              /^\d[\d,]* Pull requests? opened$/,
              /^\d[\d,]* Issues? opened$/,
              /^\d[\d,]* issue comments?$/,
            ]
            for (const el of [...document.querySelectorAll(".items-wrapper .field")]) {
              const text = el.textContent.replace(/\s+/g, " ").trim()
              if (DROP.some(re => re.test(text))) el.remove()
            }

            // two-week commit strip in the header
            for (const el of [...document.querySelectorAll(".items-wrapper .field.calendar")])
              el.remove()

            // metrics renders a bare "N Commits" with no window, which is
            // ambiguous now that it covers 12 months rather than all time
            for (const el of [...document.querySelectorAll(".items-wrapper div.field")]) {
              const match = el.textContent.replace(/\s+/g, " ").trim().match(/^(\d[\d,]*) Commits?$/)
              if (!match)
                continue
              const text = [...el.childNodes].reverse().find(node => node.nodeType === 3 && node.textContent.trim())
              if (text)
                text.textContent = ` ${match[1]} commit${match[1] === "1" ? "" : "s"} in the last year`
            }

            // collapse sections the removals above emptied out. Tested against
            // .field rather than div.field so that heading-only sections which
            // were always heading-only (e.g. the languages card's "N Languages")
            // are left alone.
            for (const section of [...document.querySelectorAll(".items-wrapper section")].reverse()) {
              if (section.querySelector("section"))
                continue
              if (section.querySelector(".field"))
                continue
              // never collapse a section holding artwork, such as the languages
              // bar, which is an <svg> sitting outside any .field
              if ([...section.querySelectorAll("svg")].some(svg => !svg.closest(".field")))
                continue
              section.remove()
            }
