name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Personal stats (amol3793)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: amol3793
          # Improves accuracy of total commits / issues / PRs / repos-contributed-to
          base_indepth: yes
          # Replaces the broken top-langs card
          plugin_languages: yes
          # Trophies replacement - disabled for now: upstream bug, the
          # achievements query still references the fully-removed GitHub
          # Projects (classic) API and errors out entirely.
          # https://github.com/lowlighter/metrics/issues/1706
          plugin_achievements: no

      - name: Work stats (amolsinha3793)
        uses: lowlighter/metrics@latest
        with:
          # Read-only token from the amolsinha3793 account. committer_token
          # defaults to this repo's own GITHUB_TOKEN regardless (see core
          # plugin docs), so this token is only ever used to fetch data -
          # it has no write access to this repo either way.
          token: ${{ secrets.WORK_METRICS_TOKEN }}
          user: amolsinha3793
          filename: github-metrics-work.svg
          base_indepth: yes
          # Default is "owner" only, which excludes org-owned repos -
          # amolsinha3793's real Uplight/Autogrid activity lives on repos
          # it doesn't personally own, so that default was silently
          # zeroing out almost everything.
          repositories_affiliations: owner, collaborator, organization_member
          plugin_languages: yes
          plugin_achievements: no
